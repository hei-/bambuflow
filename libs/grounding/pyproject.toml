# 逐句溯源校验（技术设计文档 12.2）：orchestrator 进程内调用，evaluation 用同一套实现计算 Groundedness。
[project]
name = "bambuflow-grounding"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "opentelemetry-api>=1.38"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambuflow_grounding"]
