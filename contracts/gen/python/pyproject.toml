# contracts/ 生成的 Python 代码（buf generate 产出 src/bambuflow/，不要手改）。
[project]
name = "bambuflow-contracts"
version = "0.1.0"
requires-python = ">=3.12"
# 运行时版本须不低于生成代码的版本（protobuf 7.36.2、grpc 1.84.0，见 contracts/buf.gen.yaml）。
dependencies = ["protobuf>=7.36.2,<8", "grpcio>=1.84.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambuflow"]
