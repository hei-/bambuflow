syntax = "proto3";

package bambuflow.config.v1;

// ConfigService 是 governance 向各服务下发配置的接口（governance 详设 7.1）。
// retrieval 拿到的是租户可访问的数据源，其他服务拿到受控词表，orchestrator 另有运行中的实验。
// 快照带签名：使用方只信任签名，不信任传输通道（governance 详设 9.2）；验签不过时保留旧快照并 Ack 失败原因。
service ConfigService {
  // GetSnapshot 取某个服务当前生效的快照（signed_payload 是签过名的快照本体）。
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // Watch 是长连接：只推版本变化的通知，不推内容；连接建立时先推一次当前版本。断线后使用方带上已加载的版本重连。
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // Ack 上报某个实例已加载的版本或加载失败的原因（灰度跟踪与紧急规则的生效确认，governance 详设 7.1）。
  rpc Ack(AckRequest) returns (AckResponse);
  // GetSigningKeys 返回验签用的公钥。私钥只在 governance（来自 Vault），按 key_id 轮换。
  rpc GetSigningKeys(GetSigningKeysRequest) returns (GetSigningKeysResponse);
}

message WatchRequest {
  string service = 1;
  string instance_id = 2;
  // 实例当前已加载的版本；与当前版本相同时连接建立后不推通知
  string loaded = 3;
}

// 一条版本变化的通知。
message WatchResponse {
  string service = 1;
  string snapshot_version = 2;
}

message AckRequest {
  string service = 1;
  string instance_id = 2;
  string snapshot_version = 3;
  // false 时 reason 写失败原因（如 signature_invalid、fetch_failed）
  bool loaded = 4;
  string reason = 5;
}

message AckResponse {}

message GetSigningKeysRequest {}

message GetSigningKeysResponse {
  repeated SigningKey keys = 1;
}

message SigningKey {
  string key_id = 1;
  // P-256 公钥，SubjectPublicKeyInfo 的 DER 编码；签名为 ECDSA（ASN.1 DER）over SHA-256
  bytes public_key = 2;
}

message GetSnapshotRequest {
  // 调用方服务名（processing、orchestrator 等），决定快照里放哪些对象。
  string service = 1;
}

message GetSnapshotResponse {
  // 快照内容的摘要；用到快照的结果（如文档元数据、回答的 why）记下它，回放时据此还原。
  string snapshot_version = 1;
  // 受控词表（governance 详设 6.1）：平台统一的文档类型、发文部门、主题三套。retrieval 的快照里没有。
  repeated Vocabulary vocabularies = 2;
  // 租户可访问的数据源（source_grants 中已审批、未撤销的数据源），只在 retrieval 的快照里。
  // 这是租户授权的唯一来源：没有授权的数据源不能检索（技术设计文档 9.1）。
  repeated SourceGrant source_grants = 3;
  // 运行中的 A/B 实验，只在 orchestrator 的快照里；每个租户至多一个（governance 详设 3.1）。
  repeated RunningExperiment experiments = 4;
  // 签过名的快照本体：GetSnapshotResponse 序列化后的字节（其中 signed_payload、signature、signing_key_id 为空）。
  // 使用方先验签，再从它解析出快照使用，不读外层的同名字段，避免两种语言的序列化差异影响验签。
  bytes signed_payload = 5;
  bytes signature = 6;
  string signing_key_id = 7;
  // 生效的租户配置（tenant.yaml，governance 详设 3.1、4），只在 gateway 的快照里；按租户名排序。
  repeated TenantConfig tenants = 8;
}

// TenantConfig 是一个租户当前生效的配置版本。
message TenantConfig {
  string tenant = 1;
  // 配置版本，cfv_ 前缀
  string version_id = 2;
  // tenant.yaml 原文；使用方用 libs/platform-go/tenancy 解析与校验（与 governance 发布前的校验是同一份代码）
  string content = 3;
}

// RunningExperiment 是 orchestrator 分组与替换配置需要的部分（orchestrator 详设 12.3）。
message RunningExperiment {
  string exp_id = 1;
  string tenant = 2;
  // 进入实验组的用户比例：5、20 或 50
  int32 traffic_percent = 3;
  // 实验组的句支持度门槛与引用覆盖率门槛；不填沿用基线
  optional double support_threshold = 4;
  optional double min_coverage = 5;
}

message SourceGrant {
  string tenant = 1;
  string source_id = 2;
}

message Vocabulary {
  // doc_type、dept、topic 之一。
  string name = 1;
  repeated VocabularyTerm terms = 2;
}

message VocabularyTerm {
  // 稳定编码；一旦使用就不删除、不改义，只能停用。
  string code = 1;
  string name = 2;
  // 入库归一与查询映射都按名称和同义词匹配。
  repeated string synonyms = 3;
  // 上级编码；按上级查询时包含所有下级。
  string parent = 4;
  TermStatus status = 5;
  // 停用时必填：替代它的编码。
  string replaced_by = 6;
}

enum TermStatus {
  TERM_STATUS_UNSPECIFIED = 0;
  TERM_STATUS_ACTIVE = 1;
  TERM_STATUS_DEPRECATED = 2;
}
