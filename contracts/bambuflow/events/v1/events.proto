syntax = "proto3";

package bambuflow.events.v1;

import "google/protobuf/timestamp.proto";

// 平台事件（技术设计文档 13.7）：产生方写入自己库里的发件表，与业务变更同一事务提交，再转发到事件流；
// governance 消费后按订阅投递 Webhook。至少投递一次，消费方按 event_id 去重。
// 只带 ID、类型、时间和对象 ID，不带文档或问答内容：接收方需要详情时再带身份调 API。
message PlatformEvent {
  // 前缀 evt_。
  string event_id = 1;
  // 事件名，对象.动作（技术设计文档 13.11），取值见文件末尾。
  string type = 2;
  // 事件所属的租户；为空表示与所有租户相关（如共享索引的新版本上线）。
  string tenant = 3;
  // 事件对象的 ID：batch.* 为 batch_id（bat_），index.version.* 为索引版本号，source.* 为数据源 ID（src_）。
  string object_id = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// 已实现的事件名（字符串常量，对外原样使用）：
//   batch.completed      批次结束，至少一条成功
//   batch.failed         批次结束，没有一条成功
//   index.version.live   索引新版本上线
//   source.revoked       数据源被撤销（object_id 为 src_）：connectors 据此对该源全部文档写删除标记

// ChunkAclChanged 由 indexing 在文档权限变化或写删除标记后发出（retrieval 详设 3.5），发到 Redis 流 retrieval:chunk-acl，
// retrieval 的每个副本各自读取（不用消费组），按文档 → 缓存键的反向索引删除检索结果缓存。缓存只用于提速，组装时还会按最新
// 权限复核，所以这个事件丢了也不会越权，只是缓存里多留一会儿过时的结果（最多 10 分钟）。
message ChunkAclChanged {
  // 前缀 evt_
  string event_id = 1;
  // 权限变了或写了删除标记的文档；这些文档的全部块都按变化处理
  repeated string doc_ids = 2;
  // acl 或 tombstone
  string change_type = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
