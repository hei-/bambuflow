syntax = "proto3";

package bambuflow.admin.v1;

// IndexAdminService 是索引管理接口（入库管道详设 14.4），由 indexing 实现。
// 由命令行、governance（紧急拒绝规则）与端到端测试在内部网络调用；索引版本的切换见 IndexVersionAdminService。
service IndexAdminService {
  // Publish 把待发布版本切换为线上版本。线上版本里本轮没有写到、且未打删除标记的文档原样带入（增量发布）。
  rpc Publish(PublishRequest) returns (PublishResponse);
  // 已停用，调用返回 UNIMPLEMENTED：切换或回滚改由 IndexVersionAdminService 经双人复核执行（入库管道详设 14.4）。
  // 契约按兼容规则保留（contracts/README.md），升 v2 时删除。
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {
    option deprecated = true;
  }
  // AddDenyRules 把文档、数据源或租户加入紧急拒绝名单：检索的过滤与返回前复核两处都会拦下，对线上立即生效（K9）。
  // governance 的紧急拒绝规则（/v1/admin/emergency-denials）经它写入；数据源与租户的规则只能新增。
  rpc AddDenyRules(AddDenyRulesRequest) returns (AddDenyRulesResponse);
  // RemoveDenyRules 撤销按文档的拒绝规则。
  rpc RemoveDenyRules(RemoveDenyRulesRequest) returns (RemoveDenyRulesResponse);
  // ExpireDocuments 按数据源的保留期给到期文档写删除标记（技术设计文档 9.2）：文档的源端时间（occurred_at）
  // 早于“现在 - 保留天数”的，与源端删除一样立即对线上生效，物理删除在之后的全量合并。由每天的 indexing expire 调用。
  rpc ExpireDocuments(ExpireDocumentsRequest) returns (ExpireDocumentsResponse);
  // PurgeDeleted 物理删除删除标记已超过观察期的文档在索引侧的全部副本（块、关键词与向量索引、章节摘要、图谱边、
  // 版本清单、文档标题等元数据），每份文档写一份删除凭证。由每天的 indexing purge-deleted 调用。
  rpc PurgeDeleted(PurgeDeletedRequest) returns (PurgeDeletedResponse);
  // RemapTerms 把文档元数据里已停用的受控词表编码改成替代编码（governance 详设 6.1：编码只停用不删除，
  // 已入库文档按替代编码重新标注）。对线上立即生效；幂等，governance 停用词条后调用，并定期兜底重放。
  rpc RemapTerms(RemapTermsRequest) returns (RemapTermsResponse);
}

message TermRemap {
  // doc_type、dept、topic
  string vocabulary = 1;
  string from_code = 2;
  string to_code = 3;
}

message RemapTermsRequest {
  repeated TermRemap remaps = 1;
}

message RemapTermsResponse {
  // 改动的文档数
  int64 documents = 1;
}

message PurgeDeletedRequest {
  // 删除标记写下后至少过了这么久才物理删除（观察期，期间可以撤销删除标记）；默认 168 小时
  int32 grace_hours = 1;
}

message PurgeDeletedResponse {
  int64 purged = 1;
}

message ExpireDocumentsRequest {
  // 数据源 → 保留天数（大于 0）；没列出的数据源不按时间过期（与源系统一致）
  map<string, int32> retention_days = 1;
}

message ExpireDocumentsResponse {
  // 各数据源本次写了删除标记的文档数
  map<string, int64> tombstoned = 1;
}

message AddDenyRulesRequest {
  repeated string doc_ids = 1;
  // 原因，写入审计，必填
  string reason = 2;
  // 按数据源拒绝：该源的全部文档任何人都检索不到（governance 的紧急拒绝规则，governance 详设 4.2）
  repeated string source_ids = 3;
  // 按租户拒绝：该租户的任何人都检索不到任何文档
  repeated string tenants = 4;
}

message AddDenyRulesResponse {
  // 实际新增的规则数
  int64 added = 1;
}

message RemoveDenyRulesRequest {
  repeated string doc_ids = 1;
}

message RemoveDenyRulesResponse {
  int64 removed = 1;
}

message PublishRequest {}

message PublishResponse {
  string version = 1;
  // 从原线上版本带入的文档数
  int64 carried = 2;
}

message RollbackRequest {
  // 目标版本；为空时取上一次上线的版本。
  string target_version = 1;
}

message RollbackResponse {
  string from_version = 1;
  string to_version = 2;
}
