syntax = "proto3";

package bambuflow.admin.v1;

import "google/protobuf/timestamp.proto";

// GoldenSetAdminService 是评测集题目的查看与候选题复核（evaluation 详设 3.4、8.2），由 evaluation 实现，
// gateway 的 /v1/admin/golden-sets/{tenant}/questions 调用。
//
// 评测集以仓库 golden/ 为准（评测集变更要和被评测的变更分开评审）：这里列出的是 evaluation 镜像里那一版；
// 新题先作为候选题提交，业务专家（数据属主）与平台（平台管理员）各一人复核通过后才能入集，
// 由 python -m bambuflow_evaluation candidates 导出成 YAML 走合并请求加进 golden/。
service GoldenSetAdminService {
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsResponse);
  rpc SubmitCandidate(SubmitCandidateRequest) returns (SubmitCandidateResponse);
  rpc ReviewCandidate(ReviewCandidateRequest) returns (ReviewCandidateResponse);
  // 负反馈案例（技术设计文档 F8，evaluation 详设 3.4）：用户标为“有误”或“引用不对”的回答，每天由在线抽样任务登记，
  // 只有掩码后的问题、反馈与当时引用的文档，不含用户身份。业务专家据此出候选题（origin=feedback）后标为已转题，或驳回
  rpc ListFeedbackCases(ListFeedbackCasesRequest) returns (ListFeedbackCasesResponse);
  rpc ResolveFeedbackCase(ResolveFeedbackCaseRequest) returns (ResolveFeedbackCaseResponse);
}

message FeedbackCase {
  string answer_id = 1;
  string tenant = 2;
  // 回答的时间
  google.protobuf.Timestamp answered_at = 3;
  // 掩码后的问题（与回答记录里存的相同）
  string masked_question = 4;
  // 回答的状态：answered、evidence_only、insufficient_evidence、refused
  string answer_status = 5;
  // wrong、bad_citation，可能有多条
  repeated string ratings = 6;
  // 提问人的说明（保存前已做 PII 掩码）
  repeated string comments = 7;
  // 当时引用的文档：doc_id 与标题
  repeated string cited_doc_ids = 8;
  repeated string cited_titles = 9;
  // open（待处理）、converted（已转为候选题）、dismissed（驳回）
  string status = 10;
  string resolved_by = 11;
  string resolution_note = 12;
  google.protobuf.Timestamp resolved_at = 13;
}

message ListFeedbackCasesRequest {
  string tenant = 1;
  // 为空时只列 open
  string status = 2;
}

message ListFeedbackCasesResponse {
  // 最新的在前，至多 200 条
  repeated FeedbackCase cases = 1;
}

message ResolveFeedbackCaseRequest {
  string tenant = 1;
  string answer_id = 2;
  // converted 或 dismissed
  string resolution = 3;
  // 必填，最多 500 字：转题时写候选题 ID，驳回时写原因
  string note = 4;
}

message ResolveFeedbackCaseResponse {
  FeedbackCase case = 1;
}

message GoldenExpected {
  // answered、insufficient_evidence、refused
  string status = 1;
  repeated string key_points = 2;
  repeated string must_cite = 3;
  repeated string must_not_cite = 4;
}

message GoldenQuestion {
  // 已入集的题为评测集里的 id；候选题为 cand_ 前缀
  string question_id = 1;
  string golden_set = 2;
  string bucket = 3;
  // 提问身份模板（askers.yaml 的名字）
  string asker = 4;
  string question = 5;
  GoldenExpected expected = 6;
  // in_set（已入集）；候选题为 pending、accepted、rejected
  string status = 7;
  // 候选题的来源：expert、feedback、online_sample、llm_generated
  string origin = 8;
  string submitted_by = 9;
  google.protobuf.Timestamp submitted_at = 10;
  // 已通过的复核：业务专家、平台各一人
  string expert_reviewer = 11;
  string platform_reviewer = 12;
  string reject_reason = 13;
}

message ListQuestionsRequest {
  string tenant = 1;
  // 是否包括候选题（默认只列已入集的题）
  bool include_candidates = 2;
}

message ListQuestionsResponse {
  repeated GoldenQuestion questions = 1;
  // 评测集版本（questions.yaml 的 version），按集合列出
  repeated string golden_versions = 2;
}

message SubmitCandidateRequest {
  string tenant = 1;
  string golden_set = 2;
  string bucket = 3;
  string asker = 4;
  string question = 5;
  GoldenExpected expected = 6;
  string origin = 7;
}

message SubmitCandidateResponse {
  GoldenQuestion question = 1;
}

message ReviewCandidateRequest {
  string tenant = 1;
  string question_id = 2;
  bool approved = 3;
  // 驳回时必填，最多 500 字
  string reason = 4;
}

message ReviewCandidateResponse {
  GoldenQuestion question = 1;
}
