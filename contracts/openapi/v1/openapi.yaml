  /v1/admin/golden-sets/{tenant}/questions:
    get:
      operationId: list_golden_questions
      summary: 评测集题目
      description: 该租户在已发布评测集里的题（以仓库 golden/ 为准）；include_candidates 为 true 时连同候选题。平台管理员、平台运维与数据属主可看。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - name: tenant
          in: path
          required: true
          description: 租户
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,62}$"
        - name: include_candidates
          in: query
          required: false
          description: 是否包括候选题
          schema:
            type: boolean
      responses:
        "200":
          description: 题目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/golden_question_list"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
    post:
      operationId: submit_golden_candidate
      summary: 提交候选题
      description: |
        数据属主或平台管理员提交；提问身份必须是该评测集里已有、属于这个租户的模板。
        需业务专家（数据属主）与平台（平台管理员）各一人复核通过后才能入集，入集经合并请求加进 golden/。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: tenant
          in: path
          required: true
          description: 租户
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,62}$"
      requestBody:
        description: 候选题
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/golden_candidate_request"
      responses:
        "201":
          description: 已提交，待复核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/golden_question"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/golden-sets/{tenant}/questions/{question_id}/review:
    post:
      operationId: review_golden_candidate
      summary: 复核候选题
      description: |
        业务专家（数据属主）与平台（平台管理员）各占一席，同一人不能占两席，提交人不能复核（403 self_approval_forbidden）；
        席位已满或已复核完返回 409 conflict。任一席驳回即 rejected（须写原因），两席都通过为 accepted。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: tenant
          in: path
          required: true
          description: 租户
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{0,62}$"
        - name: question_id
          in: path
          required: true
          description: 候选题 ID
          schema:
            type: string
            pattern: "^cand_[a-f0-9]{24}$"
      requestBody:
        description: 复核结论
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/golden_review_request"
      responses:
        "200":
          description: 复核后的候选题
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/golden_question"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/tenants:
