          application/json:
            schema:
              $ref: "#/components/schemas/register_plugin_request"
      responses:
        "201":
          description: 已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/plugins/{plugin_id}/security-review:
    post:
      operationId: review_plugin
      summary: Tool 插件安全评审
      description: 信息安全评审；登记人不能评审（403 self_approval_forbidden）；非 Tool 插件或已评审过的返回 409 conflict。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: plugin_id
          in: path
          required: true
          description: 插件 ID
          schema:
            type: string
            pattern: "^plg_[a-f0-9]{24}$"
      requestBody:
        description: 评审结论
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/review_plugin_request"
      responses:
        "200":
          description: 评审后的插件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/eval-gates:
