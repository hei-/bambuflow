      parameters:
        - $ref: "#/components/parameters/traceparent"
        - name: gate_id
          in: path
          required: true
          description: 门禁 ID
          schema:
            type: string
            pattern: "^gate_[a-f0-9]{24}$"
      responses:
        "200":
          description: 门禁与报告
          content:
            application/json:
