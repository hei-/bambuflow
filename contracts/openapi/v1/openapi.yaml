            pattern: "^[a-z][a-z0-9-]{0,62}$"
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/config_version_list"
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/problem" }
  /v1/admin/change-requests:
    post:
      operationId: create_change_request
      summary: 提交变更单
      description: |
        基于当前生效版本（base_version_id；新建对象时不填）提交新内容，提交时即按与 gateway 加载相同的规则校验（400）。
        base 已不是生效版本时返回 409 stale_base_version；同一对象已有待审批的变更单时返回 409 conflict。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
      requestBody:
        description: 变更内容
