        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "429": { $ref: "#/components/responses/retryable_problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
    post:
      operationId: upsert_vocabulary_term
      summary: 新增或修改词条
      description: |
        新增词条（201），或修改已有词条的名称、同义词、上级与归口部门（200）。编码一旦使用就不改义；已停用的词条不能
        重新启用（409 conflict）。改动立即进入下一版配置快照：入库归一与查询映射随之生效。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: vocabulary
          in: path
          required: true
          description: 词表
          schema:
            type: string
            enum: [doc_type, dept, topic]
      requestBody:
        description: 词条
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/vocabulary_term_request"
