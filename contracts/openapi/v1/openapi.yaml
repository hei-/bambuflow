          schema:
            type: string
            pattern: "^src_[A-Za-z0-9]+$"
      responses:
        "200":
          description: 恢复结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/resume_source_result"
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/sources/{src_id}/pending-deletions:
    get:
      operationId: list_pending_deletions
      summary: 删除保护拦下的待删批次
      description: 单轮待删超过已同步文档的 5% 或 1000 份时，删除暂停并记成一批，等数据属主确认。包括最近 20 批已结束的。平台运维与数据属主可看。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - name: src_id
          in: path
          required: true
          description: 数据源 ID
          schema:
            type: string
            pattern: "^src_[A-Za-z0-9]+$"
      responses:
        "200":
          description: 批次列表，最近的在前
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deletion_hold_list"
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/sources/{src_id}/pending-deletions/{hold_id}/confirm:
    post:
      operationId: confirm_pending_deletion
      summary: 确认待删批次
      description: 需两位不同的数据属主：第一位确认后为 awaiting_second，第二位确认后为 confirmed，下一轮同步只删其中源端仍不存在的。同一人复核返回 403 self_approval_forbidden；已结束的批次返回 409 conflict。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: src_id
          in: path
          required: true
          description: 数据源 ID
          schema:
            type: string
            pattern: "^src_[A-Za-z0-9]+$"
        - name: hold_id
          in: path
          required: true
          description: 待删批次 ID
          schema:
            type: string
            pattern: "^hold_[a-f0-9]+$"
      requestBody:
        description: 原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deletion_hold_action"
      responses:
        "200":
          description: 操作后的批次
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deletion_hold"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/sources/{src_id}/pending-deletions/{hold_id}/discard:
    post:
      operationId: discard_pending_deletion
      summary: 丢弃待删批次
      description: 这批删除不执行；源端清单不变时之后的同步也不再为同一批文档拦截。执行前任何一位数据属主都能丢弃；已结束的批次返回 409 conflict。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: src_id
          in: path
          required: true
          description: 数据源 ID
          schema:
            type: string
            pattern: "^src_[A-Za-z0-9]+$"
        - name: hold_id
          in: path
          required: true
          description: 待删批次 ID
          schema:
            type: string
            pattern: "^hold_[a-f0-9]+$"
      requestBody:
        description: 原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deletion_hold_action"
      responses:
        "200":
          description: 操作后的批次
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deletion_hold"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/index-rebuilds:
    post:
      operationId: start_index_rebuild
      summary: 申请全量重建
      description: |
        换嵌入模型或分块器时使用。双人复核：这次调用只创建待复核的操作（202），另一位平台运维调用
        POST /v1/admin/index-rebuilds/operations/{operation_id}/approve 后才开始；已有待复核的申请时返回它（200）。
        有进行中的重建或有待发布版本时返回 409 conflict。开始后各数据源全部重新拉取，按新模型部署的 processing 写进新版本，
        全部在用文档写完后由定时发布上线；期间旧模型的增量内容更新等重建发布后再写，撤权与删除照常生效。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
      requestBody:
        description: 目标版本与原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/start_rebuild_request"
      responses:
        "200":
          description: 已有的待复核申请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rebuild_operation"
        "202":
          description: 已创建待复核的操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rebuild_operation"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/index-rebuilds/operations/{operation_id}/approve:
    post:
      operationId: approve_index_rebuild
      summary: 复核并开始全量重建
      description: 另一位平台运维复核；发起人不能复核（403 self_approval_forbidden）；复核时已不能开始（如出现了待发布版本）时操作记为 failed。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: operation_id
          in: path
          required: true
          description: 操作 ID
          schema:
            type: string
            pattern: "^op_[a-f0-9]+$"
      responses:
        "200":
          description: 复核后的操作；开始了就带 rebuild_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rebuild_operation"
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/index-rebuilds/{rebuild_id}:
    get:
      operationId: get_index_rebuild
      summary: 全量重建进度
      description: 已写进新版本的在用文档数与在用文档总数。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - name: rebuild_id
          in: path
          required: true
          description: 重建 ID
          schema:
            type: string
            pattern: "^rb_[a-f0-9]+$"
      responses:
        "200":
          description: 重建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/index_rebuild"
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/index-rebuilds/{rebuild_id}/cancel:
    post:
      operationId: cancel_index_rebuild
      summary: 取消全量重建
      description: 丢弃重建的待发布版本，线上不受影响；已结束的返回 409 conflict。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: rebuild_id
          in: path
          required: true
          description: 重建 ID
          schema:
            type: string
            pattern: "^rb_[a-f0-9]+$"
      requestBody:
        description: 原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/activate_index_version_request"
      responses:
        "200":
          description: 取消后的重建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/index_rebuild"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/plugins:
    get:
      operationId: list_plugins
      summary: 插件登记列表
      description: 各插件的版本、各租户评估结果、Tool 插件的安全评审状态，以及可被哪些租户的 pipeline.yaml 引用。平台管理员与信息安全可看。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/page_token"
      responses:
        "200":
          description: 一页插件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plugin_list"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
    post:
      operationId: register_plugin
      summary: 登记插件
      description: |
        平台管理员登记一个插件版本；同名同版本已登记时返回 409 conflict。Tool 插件必须声明只读范围（read: 开头），
        登记后待信息安全评审。评估结果由 CI 写入，评估通过（Tool 还要评审通过）后才能被该租户引用。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
      requestBody:
        description: 插件
        required: true
