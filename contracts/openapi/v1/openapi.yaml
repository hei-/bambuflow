                $ref: "#/components/schemas/eval_gate_list"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/eval-gates/{gate_id}:
    get:
      operationId: get_eval_gate
      summary: 评测门禁报告
