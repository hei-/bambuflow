            application/json:
              schema:
                $ref: "#/components/schemas/change_request"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/problem" }
  /v1/admin/change-requests/{chg_id}/approve:
    post:
      operationId: approve_change_request
      summary: 审批变更单
      description: |
        作者以外的平台管理员审批（作者审批返回 403 self_approval_forbidden），审批后立即生效并推给 gateway。
        生效版本已不是 base 时变更单作废（409 stale_base_version），须基于最新版本重新提交。
      parameters:
