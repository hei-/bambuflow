  /v1/admin/replays:
    post:
      operationId: create_replay
      summary: 按条件重放死信
      description: |
        把符合条件的死信里的原事件重新放回事件流，从对象存储里的原文开始处理，不重新从源系统拉取。
        数据源、阶段、错误码至少给一个，或者用 doc_ids 点名；隔离文档只有点名才重放。没有符合条件的死信时 ingest_batch_id 为空。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
      requestBody:
        description: 重放条件与原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/replay_request"
      responses:
        "200":
          description: 重放结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/replay_result"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/problem" }
  /v1/admin/tombstone-revocations:
    post:
      operationId: revoke_tombstones
      summary: 申请撤销误写的删除标记
      description: |
        双人复核：这次调用只创建待复核的操作（202），另一位平台运维调用
        POST /v1/admin/tombstone-revocations/operations/{operation_id}/approve 后才执行；该数据源已有待复核的撤销时返回它（200）。
        按数据源与删除时间段（跨度最多 31 天）选删除标记，可再用 doc_ids 限定；没有符合条件的返回 404，超过 10000 份返回 400。
        执行后这些文档仍检索不到，connectors 下一轮同步重新从源系统拉取，源端仍存在的才恢复。索引回滚会保留删除标记，误删只能用它恢复。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
      requestBody:
        description: 撤销条件与原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/revoke_tombstones_request"
      responses:
        "200":
          description: 该数据源已有的待复核撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tombstone_revocation"
        "202":
          description: 已创建待复核的操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tombstone_revocation"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "429": { $ref: "#/components/responses/retryable_problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }

  /v1/admin/tombstone-revocations/operations/{operation_id}/approve:
    post:
      operationId: approve_tombstone_revocation
      summary: 复核并执行撤销
      description: |
        另一位平台运维复核，执行时按申请的条件重新选取删除标记。发起人不能复核自己的操作（403 self_approval_forbidden）；
        操作已执行、已作废或已过期时返回 409 conflict；复核时已没有符合条件的删除标记时操作记为 failed（200，见 failure_reason）。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: operation_id
          in: path
          required: true
          description: 操作 ID
          schema:
            type: string
            pattern: "^op_[a-f0-9]+$"
      responses:
        "200":
          description: 复核后的撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tombstone_revocation"
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "429": { $ref: "#/components/responses/retryable_problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }

  /v1/admin/sources/{src_id}/sync-status:
    get:
      operationId: get_source_sync_status
      summary: 数据源同步状态
      description: 最近一轮同步、最近一次成功的同步、新鲜度（距最近一次成功同步的秒数，从没成功过为 -1）、是否暂停。平台运维与数据属主可看，由 connectors 实现。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - name: src_id
          in: path
          required: true
          description: 数据源 ID
          schema:
            type: string
            pattern: "^src_[A-Za-z0-9]+$"
      responses:
        "200":
          description: 同步状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/source_sync_status"
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/sources/{src_id}/pause:
    post:
      operationId: pause_source
      summary: 暂停数据源同步
      description: |
        之后的每轮同步整轮跳过，直到恢复。注意暂停期间该源的撤权与删除也不再同步；已经暂停时返回原来的暂停记录（changed 为 false）。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: src_id
          in: path
          required: true
          description: 数据源 ID
          schema:
            type: string
            pattern: "^src_[A-Za-z0-9]+$"
      requestBody:
        description: 暂停原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/pause_source_request"
      responses:
        "200":
          description: 暂停记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pause_source_result"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }
  /v1/admin/sources/{src_id}/resume:
    post:
      operationId: resume_source
      summary: 恢复数据源同步
      description: 下一轮同步照常进行；本来就没有暂停时 changed 为 false。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: src_id
          in: path
          required: true
