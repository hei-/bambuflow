              schema:
                $ref: "#/components/schemas/vocabulary_term"
        "201":
          description: 新增的词条
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/vocabulary_term"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "429": { $ref: "#/components/responses/retryable_problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }

  /v1/admin/vocabularies/{vocabulary}/terms/{code}/deprecate:
    post:
      operationId: deprecate_vocabulary_term
      summary: 停用词条
      description: |
        停用并指定替代编码（同一词表里的有效词条）；原因写进变更审计。编码不删除：已入库文档上的旧编码在重新标注前
        仍可查到。已停用的再停用返回原样。
      parameters:
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/required_idempotency_key"
        - name: vocabulary
          in: path
          required: true
          description: 词表
          schema:
            type: string
            enum: [doc_type, dept, topic]
        - name: code
          in: path
          required: true
          description: 词条编码
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9-]{1,63}$"
      requestBody:
        description: 替代编码与原因
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deprecate_term_request"
      responses:
        "200":
          description: 停用后的词条
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/vocabulary_term"
        "400": { $ref: "#/components/responses/problem" }
        "401": { $ref: "#/components/responses/problem" }
        "403": { $ref: "#/components/responses/problem" }
        "404": { $ref: "#/components/responses/problem" }
        "409": { $ref: "#/components/responses/problem" }
        "429": { $ref: "#/components/responses/retryable_problem" }
        "503": { $ref: "#/components/responses/retryable_problem" }

  /v1/admin/documents/{doc_id}/ingest-status:
