# 入库管道的 processing（入库管道详设）：解析、分块、向量化，交给 indexing 写入。
# 解析依赖（P1-T2）：pypdfium2 打开 PDF、渲染扫描页，pdfplumber 抽取文字行与表格，Pillow 读图片尺寸
# （PyMuPDF 是 AGPL，已替换；技术设计文档 12.6 的选型同步修改）；Word、Excel 用
# python-docx、openpyxl，比设计列出的 Unstructured 轻得多（后者连带 OCR 与模型依赖），只取我们要的结构；
# 邮件与 CSV 用标准库。OCR（PaddleOCR）不在这里，只装在单独的 OCR 镜像里（ocr/）。
[project]
name = "bambuflow-processing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bambuflow-contracts",
    "bambuflow-platform",
    "bambuflow-vocabulary",
    "grpcio>=1.84.0",
    "httpx>=0.28",
    "redis>=5.2",
    "minio>=7.2",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pillow>=11.0",
    "python-docx>=1.2",
    "openpyxl>=3.1",
]

[tool.uv.sources]
bambuflow-contracts = { workspace = true }
bambuflow-platform = { workspace = true }
bambuflow-vocabulary = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambuflow_processing"]
