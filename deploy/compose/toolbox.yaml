# 开发工具容器（见 deploy/toolbox/Dockerfile）。由 Makefile 调用，不需要手动启动。
name: bambuflow-toolbox

services:
  toolbox:
    build:
      context: ../..
      dockerfile: deploy/toolbox/Dockerfile
      args:
        GOPROXY: ${BF_GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${BF_NPM_REGISTRY:-https://registry.npmjs.org}
    # 并行的工作树各用自己的标签（BF_TOOLBOX_TAG），避免互相覆盖镜像与虚拟环境；下载缓存共用
    image: bambuflow-toolbox:${BF_TOOLBOX_TAG:-dev}
    volumes:
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - uv-cache:/root/.cache/uv
      - venv:/opt/venv
      - tools:/root/.cache/bambuflow-tools
      - npm-cache:/root/.npm
      # console 的依赖装在命名卷里（遮住随源码打进镜像的目录），每次 npm ci 只需从缓存还原
      - console-modules:/src/services/console/node_modules

volumes:
  go-mod:
  go-build:
  uv-cache:
  venv:
    name: bambuflow-toolbox_venv-${BF_TOOLBOX_TAG:-dev}
  tools:
  npm-cache:
  console-modules:
    name: bambuflow-toolbox_console-modules-${BF_TOOLBOX_TAG:-dev}
