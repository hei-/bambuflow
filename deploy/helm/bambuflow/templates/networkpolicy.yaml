{{- /*
入站白名单（技术设计文档 12.6）：本 release 的在线服务默认拒绝所有入站，只放行
- 入口所在命名空间 → gateway:8080；
- gateway、orchestrator、qa/batch → retrieval:9090；gateway、qa/batch → orchestrator:9090；orchestrator → governance:9090（词表快照）；retrieval → governance:9090（租户授权）；
  gateway → evaluation:9090（A/B 分析、在线质量趋势、门禁报告）；governance → evaluation:9090（租户转全量前核对门禁）；
  入库平面（indexing 的发布任务）→ evaluation:9090（发布前的评测门禁）；evaluation → retrieval-eval、orchestrator-eval:9090，
  orchestrator-eval → retrieval-eval:9090（评测副本只接评测流量）；retrieval-eval、orchestrator-eval → evaluation:8081（评测身份的验签公钥）；
  governance → evaluation:9090（配置发布的门禁）、evaluation:8081（评测副本取候选配置时校验评测身份）；
  gateway → governance:9090 另有租户配置快照；evaluation 与它的护栏检查（evaluation-guard）、灰度观察（evaluation-observe）
  → governance:9090（实验、灰度）、orchestrator:9090（回答记录导出）；在线抽样评审（evaluation-online）→ orchestrator:9090；
  gateway → governance:9090（管理接口，gateway 详设 4.2）；gateway、governance → indexing:9090、gateway → processing-admin:9090、connectors-admin:9090 在入库平面（不在本 chart），出站由服务网格管理；
- gateway → qa/batch:9090（受理批次）；qa/batch → gateway:9090（换发 Principal，gateway 详设 3.3）；
- retrieval、orchestrator、qa/batch、governance、evaluation 与入库平面（networkPolicy.ingestNamespace，indexing）→ gateway:8081（取 Principal 验签公钥）；
- 监控命名空间 → 各服务的指标端口 9464（含只有出站的 webhook）。
webhook 只有出站（事件流、Vault、订阅方回调地址），它的订阅管理接口（9090）现由运维经 kubectl port-forward 调用，
除指标外不放行任何入站；console 接入后经 gateway 调用时再放行 gateway。
探针由 kubelet 发起，不受 NetworkPolicy 限制。出站（数据库、对象存储、Vault、模型服务、LLM 网关）由服务网格的出站策略管理，
地址随部署环境而定，不在这里写死。
*/ -}}
{{- $r := .Release.Name -}}
{{- define "bambuflow.peer" -}}
- podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .component }}
      app.kubernetes.io/instance: {{ .root.Release.Name }}
{{- end -}}
{{- define "bambuflow.namespace" -}}
- namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ . }}
{{- end -}}
{{- $rules := dict
  "gateway" (list
    (dict "port" 8080 "from" (include "bambuflow.namespace" .Values.networkPolicy.ingressNamespace))
    (dict "port" 8081 "from" (print (include "bambuflow.peer" (dict "root" $ "component" "retrieval")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "orchestrator")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "batch")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "governance")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "retrieval-eval")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "orchestrator-eval")) "\n" (include "bambuflow.namespace" .Values.networkPolicy.ingestNamespace)))
    (dict "port" 9090 "from" (include "bambuflow.peer" (dict "root" $ "component" "batch"))))
  "retrieval" (list
    (dict "port" 9090 "from" (print (include "bambuflow.peer" (dict "root" $ "component" "gateway")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "orchestrator")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "batch")))))
  "orchestrator" (list
    (dict "port" 9090 "from" (print (include "bambuflow.peer" (dict "root" $ "component" "gateway")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "batch")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation-guard")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation-observe")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation-online")))))
  "governance" (list
    (dict "port" 9090 "from" (print (include "bambuflow.peer" (dict "root" $ "component" "orchestrator")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "gateway")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "retrieval")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation-guard")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "evaluation-observe")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "retrieval-eval")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "orchestrator-eval")))))
  "evaluation" (list
    (dict "port" 9090 "from" (print (include "bambuflow.peer" (dict "root" $ "component" "gateway")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "governance")) "\n" (include "bambuflow.namespace" .Values.networkPolicy.ingestNamespace)))
    (dict "port" 8081 "from" (print (include "bambuflow.peer" (dict "root" $ "component" "retrieval-eval")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "orchestrator-eval")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "governance")))))
  "retrieval-eval" (list
    (dict "port" 9090 "from" (print (include "bambuflow.peer" (dict "root" $ "component" "evaluation")) "\n" (include "bambuflow.peer" (dict "root" $ "component" "orchestrator-eval")))))
  "orchestrator-eval" (list
    (dict "port" 9090 "from" (include "bambuflow.peer" (dict "root" $ "component" "evaluation"))))
  "batch" (list
    (dict "port" 9090 "from" (include "bambuflow.peer" (dict "root" $ "component" "gateway"))))
  "webhook" (list)
-}}
{{- range $name, $ports := $rules }}
{{- $ctx := dict "root" $ "component" $name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bambuflow.name" $ctx }}
  labels:
    {{- include "bambuflow.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bambuflow.selector" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- range $ports }}
    - ports:
        - port: {{ .port }}
      from:
        {{- .from | nindent 8 }}
    {{- end }}
    {{- include "bambuflow.metricsIngress" $.Values.networkPolicy.monitoringNamespace | nindent 4 }}
{{- end }}
