{{- /* 租户配置与管理接口的角色映射（gateway）、策略包的数据源层与租户层（governance 首次启动时导入）、
sql_query 的视图目录（orchestrator）、紧急拒绝规则的签名文件（retrieval 的备用通道，governance 详设 8.2），
内容来自 values 的 tenants、gateway.adminRoles、policyLayers、orchestrator.sqlCatalog、retrieval.emergencyDenials */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-tenants
data:
  {{- range $t, $cfg := .Values.tenants }}
  {{ $t }}.yaml: |
    {{- toYaml (merge (dict "tenant" $t) $cfg) | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-policy-layers
data:
  {{- range $name, $body := .Values.policyLayers }}
  {{ $name }}.rego: {{ $body | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-admin-roles
data:
  admin-roles.yaml: |
    {{- toYaml (dict "roles" .Values.gateway.adminRoles) | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-sql-catalog
data:
  sql-catalog.yaml: |
    {{- toYaml .Values.orchestrator.sqlCatalog | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-emergency-denials
data:
  {{- range $name, $signed := .Values.retrieval.emergencyDenials }}
  {{ $name }}.json: {{ $signed | quote }}
  {{- end }}
