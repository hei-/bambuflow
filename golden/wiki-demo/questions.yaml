questions:
  # ---- 个人消费贷款（信贷） ----
  - {id: q_wiki_001, bucket: single_hop, asker: credit_l2, question: 个人消费贷款的单户授信额度怎么计算？,
     expected: {status: answered, key_points: [近 12 个月平均月收入乘以 10 倍, 不超过 30 万元], must_cite: [*loan_amount]}}
  - {id: q_wiki_002, bucket: single_hop, asker: credit_l2, question: 个人消费贷款单户额度最高是多少？,
     expected: {status: answered, key_points: [不超过 30 万元], must_cite: [*loan_amount]}}
  - {id: q_wiki_003, bucket: single_hop, asker: credit_l2, question: 借款人已有其他消费类负债时额度怎么处理？,
     expected: {status: answered, key_points: [扣减未结清余额], must_cite: [*loan_amount]}}
  - {id: q_wiki_004, bucket: single_hop, asker: credit_l2, question: 个人消费贷款额度由谁审批？,
     expected: {status: answered, key_points: [10 万元（含）以下支行审批, 10 万元以上分行信贷审批部审批], must_cite: [*loan_approval]}}
  - {id: q_wiki_005, bucket: single_hop, asker: credit_l2, question: 15 万元的消费贷款需要哪一级审批？,
     expected: {status: answered, key_points: [分行信贷审批部], must_cite: [*loan_approval]}}
  - {id: q_wiki_006, bucket: single_hop, asker: credit_l2, question: 个人消费贷款的期限最长几年？,
     expected: {status: answered, key_points: [最长 5 年], must_cite: [*loan_term]}}
  - {id: q_wiki_007, bucket: single_hop, asker: credit_l2, question: 个人消费贷款利率怎么定？,
     expected: {status: answered, key_points: [按本行定价办法执行, 不低于同期贷款市场报价利率], must_cite: [*loan_term]}}
  - {id: q_wiki_008, bucket: single_hop, asker: credit_l2, question: 个人消费贷款可以用来买房吗？,
     expected: {status: answered, key_points: [不得用于购房、证券投资等禁止性用途], must_cite: [*loan_general]}}
  - {id: q_wiki_009, bucket: single_hop, asker: credit_l2, question: 个人消费贷款管理办法从什么时候开始施行？,
     expected: {status: answered, key_points: [2025 年 3 月 1 日起施行, 原 2024 版同时废止], must_cite: [*loan_effective]}}
  - {id: q_wiki_010, bucket: single_hop, asker: credit_l2, question: 个人消费贷款管理办法适用于哪些贷款？,
     expected: {status: answered, key_points: [向自然人发放的个人消费用途人民币贷款], must_cite: [*loan_scope]}}
  - {id: q_wiki_011, bucket: single_hop, asker: credit_l2, question: 制定个人消费贷款管理办法的目的是什么？,
     expected: {status: answered, key_points: [规范个人消费贷款业务, 控制信用风险], must_cite: [*loan_general]}}

  # ---- 反洗钱（信贷与风险都可见） ----
  - {id: q_wiki_012, bucket: single_hop, asker: credit_l2, question: 一线员工发现可疑交易后应该怎么做？,
     expected: {status: answered, key_points: [当日通过反洗钱系统提交初报, 不得向客户透露], must_cite: [*aml_flow]}}
  - {id: q_wiki_013, bucket: single_hop, asker: credit_l2, question: 支行反洗钱岗收到初报后多久内完成复核？,
     expected: {status: answered, key_points: [两个工作日内], must_cite: [*aml_flow]}}
  - {id: q_wiki_014, bucket: single_hop, asker: risk_manager, question: 分行反洗钱中心多长时间内要形成可疑交易报告？,
     expected: {status: answered, key_points: [五个工作日内完成分析], must_cite: [*aml_flow]}}
  - {id: q_wiki_015, bucket: single_hop, asker: risk_manager, question: 涉嫌恐怖融资的可疑交易报送有时限要求吗？,
     expected: {status: answered, key_points: [应当立即报送, 不受时限限制], must_cite: [*aml_flow]}}
  - {id: q_wiki_016, bucket: single_hop, asker: credit_l2, question: 可疑交易报告和分析底稿要保存多久？,
     expected: {status: answered, key_points: [至少保存五年], must_cite: [*aml_flow]}}
  - {id: q_wiki_017, bucket: single_hop, asker: risk_manager, question: 怎么识别拆分交易规避大额报告？,
     expected: {status: answered, key_points: [系统自动预警, 合并分析各网点各渠道交易], must_cite: [*aml_flow]}}
  - {id: q_wiki_018, bucket: single_hop, asker: credit_l2, question: 客户经理能劝阻员工提交可疑交易初报吗？,
     expected: {status: answered, key_points: [不得劝阻或干预, 记录在案并追责], must_cite: [*aml_flow]}}
  - {id: q_wiki_019, bucket: single_hop, asker: risk_manager, question: 反洗钱中心多久抽查一次可疑交易报告质量？,
     expected: {status: answered, key_points: [每季度抽查, 纳入合规考核], must_cite: [*aml_audit]}}
  - {id: q_wiki_020, bucket: single_hop, asker: credit_l2, question: 一线员工每年要参加多少反洗钱培训？,
     expected: {status: answered, key_points: [每年不少于 4 学时, 考试合格方可上岗], must_cite: [*aml_training]}}

  # ---- 风险限额（机密级，只有风险经理可见） ----
  - {id: q_wiki_021, bucket: single_hop, asker: risk_manager, question: 全行风险限额分为哪几类？,
     expected: {status: answered, key_points: [集中度限额, 行业限额, 单一客户限额], must_cite: [*risk_system]}}
  - {id: q_wiki_022, bucket: single_hop, asker: risk_manager, question: 单一集团客户授信总额上限是多少？,
     expected: {status: answered, key_points: [不超过资本净额的 15%, 超过 10% 报风险管理委员会审议], must_cite: [*risk_single]}}
  - {id: q_wiki_023, bucket: single_hop, asker: risk_manager, question: 限额使用率达到多少会触发预警？,
     expected: {status: answered, key_points: [90% 预警, 100% 暂停新增授信], must_cite: [*risk_over]}}

  # ---- 员工手册（全员可见） ----
  - {id: q_wiki_024, bucket: single_hop, asker: credit_l2, question: 工作日上班时间是几点到几点？,
     expected: {status: answered, key_points: [9:00 至 17:30, 弹性打卡前后 30 分钟], must_cite: [*hb_hours]}}
  - {id: q_wiki_025, bucket: single_hop, asker: risk_manager, question: 年假需要提前多久申请？,
     expected: {status: answered, key_points: [提前 3 个工作日在人力系统提交, 直属主管审批], must_cite: [*hb_leave]}}
  - {id: q_wiki_026, bucket: single_hop, asker: credit_l2, question: 可以在个人手机上保存客户信息吗？,
     expected: {status: answered, key_points: [不得在个人设备上存储客户信息], must_cite: [*hb_security]}}

  # ---- 属主可见的草稿 ----
  - {id: q_wiki_027, bucket: single_hop, asker: credit_owner, question: 授信政策修订草稿拟把消费贷款单户上限调整到多少？,
     expected: {status: answered, key_points: [拟由 30 万元调整为 50 万元, 尚未审议], must_cite: [*draft]}}

  # ---- 应拒答：无权文档、无人可见文档、样例里没有的内容（≥ 15%） ----
  - {id: q_wiki_028, bucket: should_refuse, asker: credit_l2, question: 单一集团客户授信总额不得超过资本净额的多少？,
     notes: 风险限额规程是机密级、只对风险管理部开放，信贷客户经理无权看到,
     expected: {status: insufficient_evidence, key_points: [], must_cite: [], must_not_cite: [*risk_system, *risk_single, *risk_over]}}
  - {id: q_wiki_029, bucket: should_refuse, asker: credit_l2, question: 授信政策修订草稿里拟把单户上限调到多少？,
     notes: 草稿没有 ACL，只有属主 carl 可见,
     expected: {status: insufficient_evidence, key_points: [], must_cite: [], must_not_cite: [*draft]}}
  - {id: q_wiki_030, bucket: should_refuse, asker: risk_manager, question: 历史迁移页面原来的属主是谁？,
     notes: 没有 ACL 也没有属主的页面，任何人都不可见,
     expected: {status: insufficient_evidence, key_points: [], must_cite: [], must_not_cite: [*orphan]}}
  - {id: q_wiki_031, bucket: should_refuse, asker: credit_l2, question: 公司食堂的午餐供应时间是几点？,
     notes: 样例源里没有相关内容,
     expected: {status: insufficient_evidence, key_points: [], must_cite: []}}
  - {id: q_wiki_032, bucket: should_refuse, asker: risk_manager, question: 外汇交易员的单日敞口限额是多少？,
     notes: 样例源里没有相关内容,
     expected: {status: insufficient_evidence, key_points: [], must_cite: []}}

  # ---- P1 扩充（2026-10-05）----
  - {id: q_wiki_033, bucket: single_hop, asker: credit_l2, question: 首套住房贷款最低首付比例是多少？,
     notes: 新版 20%，已废止的 2023 版为 30%，回答不得采用旧版,
     expected: {status: answered, key_points: [首套 20%], must_cite: [*mort_down]}}
  - {id: q_wiki_034, bucket: single_hop, asker: credit_l2, question: 二套住房的最低首付比例是多少？,
     notes: 已废止的 2023 版为 40%,
     expected: {status: answered, key_points: [二套 30%], must_cite: [*mort_down]}}
  - {id: q_wiki_035, bucket: single_hop, asker: credit_l2, question: 个人住房贷款期限最长多少年，对借款人年龄有什么要求？,
     expected: {status: answered, key_points: [最长 30 年, 年龄与期限之和不超过 70 岁], must_cite: [*mort_term]}}
  - {id: q_wiki_036, bucket: single_hop, asker: credit_l2, question: 住房贷款对借款人月还款额与收入之比有什么要求？,
     expected: {status: answered, key_points: [不超过 50%, 夫妻可合并收入], must_cite: [*mort_dti]}}
  - {id: q_wiki_037, bucket: single_hop, asker: credit_l2, question: 住房贷款提前还款要收违约金吗？,
     notes: 已废止的 2023 版收取 1% 违约金,
     expected: {status: answered, key_points: [本行不收取违约金, 还款满 12 个月后可申请], must_cite: [*mort_prepay]}}
  - {id: q_wiki_038, bucket: single_hop, asker: credit_l2, question: 住房贷款每年最多可以提前还款几次？,
     expected: {status: answered, key_points: [每年不超过 2 次, 单次不少于 5 万元], must_cite: [*mort_prepay]}}
  - {id: q_wiki_039, bucket: single_hop, asker: credit_l2, question: 车位可以申请个人住房贷款吗？,
     expected: {status: answered, key_points: [不适用于商业用房和车位贷款], must_cite: [*mort_scope]}}
  - {id: q_wiki_040, bucket: single_hop, asker: credit_l2, question: 2023 版个人住房贷款管理办法现在还有效吗？,
     expected: {status: answered, key_points: [已于 2025 年 5 月 10 日被新版替代], must_cite: [*mort23_valid]}}
  - {id: q_wiki_041, bucket: single_hop, asker: credit_l2, question: 住宅作为抵押物的抵押率上限是多少？,
     expected: {status: answered, key_points: [住宅 70%], must_cite: [*col_ratio]}}
  - {id: q_wiki_042, bucket: single_hop, asker: credit_l2, question: 存单质押的质押率最高是多少？,
     expected: {status: answered, key_points: [存单、国债质押 90%], must_cite: [*col_ratio]}}
  - {id: q_wiki_043, bucket: single_hop, asker: credit_l2, question: 抵押物评估报告的有效期是多久？,
     expected: {status: answered, key_points: [12 个月], must_cite: [*col_eval]}}
  - {id: q_wiki_044, bucket: single_hop, asker: credit_owner, question: 500 万元以上的抵押物需要几家机构评估？,
     expected: {status: answered, key_points: [两家机构分别评估, 取较低值], must_cite: [*col_eval]}}
  - {id: q_wiki_045, bucket: single_hop, asker: credit_l2, question: 住宅抵押物多久重新评估一次？,
     expected: {status: answered, key_points: [每 2 年, 房价指数一年内跌超 10% 时 1 个月内重评], must_cite: [*col_reeval]}}
  - {id: q_wiki_046, bucket: single_hop, asker: credit_l2, question: 抵押权证调阅需要谁审批？,
